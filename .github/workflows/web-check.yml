name: Web check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - unificazione-web-app

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
